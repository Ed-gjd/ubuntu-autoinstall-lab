#cloud-config
autoinstall:
  version: 1
  updates: none
  locale: zh_CN.UTF-8
  keyboard:
    layout: cn
  timezone: Asia/Shanghai
  identity:
    hostname: ubuntu24
    realname: Ubuntu User
    username: user
    password: "$6$u0NyKm8Srvi0393c$GZbCe/vDhPRBEoLT1XmiU9OzArjIKqhlI65jeSVFrIGqF1NY9tGHRS3GYQFs.RUnGwoY7eMDyV7ZdXX0qwMiO0"
  ssh:
    install-server: true
    allow-pw: true
  storage:
    layout:
      name: lvm
  packages:
    - build-essential
    - git
    - curl
    - wget
    - vim
    - htop
    - net-tools
    - open-vm-tools
    - docker.io
    - python3-pip
    - python3-venv
    - python3-numpy
    - python3-pandas
    - python3-matplotlib
    - python3-scipy
    - python3-sklearn
    - ipython3
    - jupyter-notebook
    - language-pack-zh-hans
    - fonts-noto-cjk
  late-commands:
    - curtin in-target -- bash -c 'locale-gen zh_CN.UTF-8; printf "LANG=zh_CN.UTF-8\nLC_NUMERIC=zh_CN.UTF-8\nLC_TIME=zh_CN.UTF-8\n" > /etc/default/locale'
    - curtin in-target -- bash -c 'usermod -aG docker user || true'
  shutdown: poweroff
